<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a6b53">
<title>RE:CAN – mobilná aplikácia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Titan+One&display=swap" rel="stylesheet">
<style>
:root{--oat:#f5f3ee;--ink:#1e1e1e;--matcha:#4a6b53;--peach:#f4a28c;--berry:#9bb1ff;--muted:#5c5f58;--line:rgba(30,30,30,.14);
--display:'Titan One','Arial Rounded MT Bold',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--matcha);display:flex;align-items:center;justify-content:center;gap:56px;padding:20px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.side{max-width:330px;color:var(--oat)}
.side img{height:54px;margin-bottom:22px}
.side h1{font-size:2rem;margin-bottom:12px}
.side p{line-height:1.55;margin-bottom:12px;opacity:.92}
.side ul{padding-left:1.1em;line-height:1.6;opacity:.92;margin:0}
.side .tag{display:inline-block;border:2px dotted var(--oat);border-radius:99px;padding:4px 14px;font-weight:600;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
@media (max-width:860px){.side{display:none}}

.phone-wrap{position:relative;flex:none;width:426px;height:898px}
.phone{position:absolute;left:0;top:0;width:426px;height:898px;transform-origin:0 0;background:var(--ink);border-radius:64px;padding:12px;box-shadow:0 40px 80px -24px rgba(0,0,0,.6),inset 0 0 0 2px #3a3a3a}
.phone::before,.phone::after{content:'';position:absolute;width:4px;border-radius:2px;background:#2a2a2a}
.phone::before{left:-4px;top:190px;height:64px;box-shadow:0 84px 0 #2a2a2a}
.phone::after{right:-4px;top:230px;height:100px}
.screen{position:relative;height:100%;background:var(--oat);border-radius:52px;overflow:hidden;display:flex;flex-direction:column}
.status{flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0;font-weight:700;font-size:.95rem}
.status::after{content:'';position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:99px;background:var(--ink)}
.home-bar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;pointer-events:none}
.tabs{padding-bottom:24px!important}
/* na skutočnom mobile aplikácia zaberie celú obrazovku bez rámčeka */
body.bare{padding:0;display:block}
body.bare .side{display:none}
body.bare .phone-wrap{width:100vw;height:100dvh}
body.bare .phone{position:static;width:100%;height:100%;transform:none!important;border-radius:0;padding:0;box-shadow:none}
body.bare .phone::before,body.bare .phone::after,body.bare .status::after,body.bare .home-bar{display:none}
body.bare .screen{border-radius:0}
body.bare .status{height:env(safe-area-inset-top,0px);padding:0;overflow:hidden}
body.bare .tabs{padding-bottom:max(14px,env(safe-area-inset-bottom))!important}
.view{flex:1;overflow-y:auto;padding:8px 18px 24px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 8px 14px}
.tabs button{position:relative;border:0;background:none;padding:8px 0 4px;border-radius:14px;font-size:.72rem;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:3px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--matcha)}
.tabs .badge{position:absolute;top:2px;left:54%;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--peach);color:var(--ink);font-size:.7rem;font-weight:700;display:grid;place-items:center}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;min-height:40px}
.top img{height:26px}
.top h1{font-size:1.5rem}
.back{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:1.1rem;font-weight:700}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:99px;border:2px solid var(--ink);background:var(--ink);color:var(--oat);font-weight:700;padding:8px 18px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{width:auto;min-height:38px;font-size:.85rem;padding:4px 14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:#fff;border:2px solid var(--ink);border-radius:22px;padding:16px;margin-bottom:14px}
.note{font-size:.78rem;color:var(--muted);border-left:3px dotted var(--ink);padding-left:10px;margin-top:12px;line-height:1.45}

.hero{position:relative;border:2px solid var(--ink);border-radius:26px;padding:18px 150px 18px 18px;min-height:210px;margin-bottom:18px;overflow:hidden;background:var(--c)}
.hero h2{font-size:1.65rem;margin-bottom:8px}
.hero p{font-size:.88rem;font-weight:500;margin-bottom:14px}
.hero img{position:absolute;right:14px;top:14px;height:182px;transform:rotate(7deg);filter:drop-shadow(0 12px 10px rgba(0,0,0,.3))}
.row-head{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 10px}
.row-head h2{font-size:1.2rem}
.link{border:0;background:none;padding:6px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -18px 18px;padding:0 18px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:112px;border:2px solid var(--ink);border-radius:18px;background:var(--soft);padding:10px 8px;text-align:center;font-weight:700;font-size:.8rem}
.mini img{height:104px;margin:0 auto 6px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{border:2px solid var(--ink);border-radius:20px;background:#fff;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.pcard .media{background:var(--soft);padding:12px;height:150px}
.pcard img{height:100%;margin:auto;object-fit:contain}
.pcard .body{padding:10px 12px 12px}
.pcard h3{font-size:.98rem;margin-bottom:2px}
.pcard small{color:var(--muted);font-size:.74rem;display:block;min-height:2.6em;line-height:1.3}
.price{font-family:var(--display);font-size:1.1rem}

.detail-media{background:var(--c);border:2px solid var(--ink);border-radius:26px;height:300px;padding:18px;margin-bottom:16px}
.detail-media img{height:100%;margin:auto;object-fit:contain;filter:drop-shadow(0 14px 12px rgba(0,0,0,.3))}
.detail h2{font-size:1.9rem}
.detail .flavor{font-weight:700;margin:2px 0 10px}
.detail p{line-height:1.5;font-size:.95rem}
.buy{display:flex;gap:10px;margin-top:16px}
.qty{flex:none;display:flex;align-items:center;border:2px solid var(--ink);border-radius:99px;background:#fff;height:50px}
.qty button{width:42px;height:42px;border:0;background:none;font-size:1.2rem;font-weight:700;border-radius:50%}
.qty button:disabled{opacity:.3}
.qty output{min-width:24px;text-align:center;font-weight:700}

.line{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}
.line .thumb{background:var(--soft);border:1.5px solid var(--ink);border-radius:12px;height:74px;padding:5px}
.line .thumb img{height:100%;margin:auto;object-fit:contain}
.line h3{font-size:1rem}
.line small{color:var(--muted)}
.line .qty{height:40px;margin-top:6px}
.line .qty button{width:34px;height:34px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);font-weight:600}
.total b{font-family:var(--display);font-weight:400;font-size:1.6rem}
label{display:block;font-weight:700;font-size:.88rem;margin:12px 0 5px}
input{width:100%;min-height:48px;border:2px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fff}
.err{color:#c62f3b;font-weight:600;font-size:.82rem;margin-top:5px}
.alert{background:#fbd5c8;border:2px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:.84rem;line-height:1.45;margin-bottom:14px}
.empty{text-align:center;padding:60px 10px}
.empty h2{font-size:1.5rem;margin-bottom:8px}
.empty p{color:var(--muted);margin-bottom:20px}
.ok{width:68px;height:68px;border-radius:50%;background:#a9c4b0;border:2px solid var(--ink);display:grid;place-items:center;font-size:1.8rem;font-weight:700;margin:30px auto 16px}

.refill-card{background:var(--matcha);color:var(--oat);border:2px solid var(--ink);border-radius:26px;padding:20px;margin-bottom:16px}
.refill-card h2{font-size:1.5rem;margin-bottom:6px}
.refill-card .eyebrow{color:#ffd9cc}
.dots{display:flex;gap:8px;margin:16px 0 10px}
.dots i{flex:1;aspect-ratio:1;border-radius:50%;border:2px dotted var(--oat);display:grid;place-items:center;font-style:normal;font-weight:700}
.dots i.on{background:var(--peach);border:2px solid var(--ink);color:var(--ink)}
.refill-card .btn{background:var(--oat);color:var(--ink);border-color:var(--oat);margin-top:12px}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;margin-bottom:12px}
.steps b{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:400;background:var(--peach)}
.steps li:nth-child(2) b{background:var(--berry)}
.steps li:nth-child(3) b{background:#a9c4b0}
.steps h3{font-size:1rem;margin-bottom:2px}
.steps p{font-size:.85rem;color:var(--muted);line-height:1.4}
.toast{position:absolute;left:18px;right:18px;bottom:92px;background:var(--ink);color:var(--oat);border-radius:16px;padding:12px 16px;font-weight:600;font-size:.88rem;text-align:center;animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

// Rámček iPhone 17 (402 × 874 bodov) zväčšený tak, aby sa zmestil na výšku aj šírku okna.
function fitPhone(){
  const bare = window.innerWidth < 520;
  document.body.classList.toggle('bare', bare);
  const wrap = document.getElementById('phone-wrap'), phone = document.getElementById('phone');
  if (bare) { wrap.style.width = wrap.style.height = ''; phone.style.transform = ''; return; }
  const side = window.innerWidth > 860 ? 330 + 56 : 0;
  const scale = Math.min((window.innerHeight - 40) / 898, (window.innerWidth - 40 - side) / 426, 1.35);
  phone.style.transform = 'scale(' + scale + ')';
  wrap.style.width = (426 * scale) + 'px';
  wrap.style.height = (898 * scale) + 'px';
}
window.addEventListener('resize', fitPhone);

}

        <p class="eyebrow" style="color:inherit">Príchuť dňa</p>
        <h2>${f.name}</h2>
        <p>${f.flavor}</p>
        <button class="btn small" data-act="open" data-id="${f.id}">Pozrieť</button>
        <img src="${f.img}" alt="Plechovka RE:CAN ${f.name}">
      </section>
      <div class="row-head"><h2>Všetky príchute</h2><button class="link" data-act="tab" data-id="shop">Zobraziť</button></div>
      <div class="hscroll">${products.map(p => `
        <button class="mini" style="--soft:${p.soft}" data-act="open" data-id="${p.id}"><img src="${p.img}" alt="">${p.name}</button>`).join('')}
      </div>
      <button class="card" style="width:100%;text-align:left" data-act="tab" data-id="refill">
        <p class="eyebrow">Refill karta</p>
        <h3 style="font-size:1.15rem;margin-bottom:4px">${state.returned} z ${REFILL_GOAL} vrátených obalov</h3>
        <p style="font-size:.88rem;color:var(--muted)">Vyber. Vychutnaj. Vráť. Za vrátené plechovky máš zľavu.</p>
      </button>`;
  },
  shop(){
    return `
      <div class="top"><h1>Príchute</h1><span class="eyebrow" style="margin:0">RE:CAN Electrolytes</span></div>
      <div class="grid">${products.map(p => `
        <button class="pcard" style="--soft:${p.soft}" data-act="open" data-id="${p.id}" aria-label="${p.name}, ${p.flavor}, ${money(PRICE)}">
          <span class="media"><img src="${p.img}" alt=""></span>
          <span class="body"><h3>${p.name}</h3><small>${p.flavor}</small><span class="price">${money(PRICE)}</span></span>
        </button>`).join('')}
      </div>
      <p class="note">Plechovka 500 ml. Osobný odber zdarma, platíš pri prevzatí.</p>`;
  },
  detail(){
    const p = byId(state.detail);
    return `
      <div class="top"><button class="back" data-act="tab" data-id="shop" aria-label="Späť na príchute">←</button><span class="eyebrow" style="margin:0">RE:CAN Electrolytes</span></div>
      <div class="detail">
        <div class="detail-media" style="--c:${p.c}"><img src="${p.img}" alt="Plechovka RE:CAN ${p.name}"></div>
        <h2>${p.name}</h2>
        <p class="flavor">${p.flavor} · <span class="price">${money(PRICE)}</span></p>
        <p>${p.desc}</p>
        <div class="buy">
          <div class="qty" role="group" aria-label="Množstvo">
            <button data-act="qty" data-id="-1" ${state.qty <= 1 ? 'disabled' : ''} aria-label="Znížiť množstvo">−</button>
            <output>${state.qty}</output>
            <button data-act="qty" data-id="1" ${state.qty >= 12 ? 'disabled' : ''} aria-label="Zvýšiť množstvo">+</button>
          </div>
          <button class="btn" data-act="add">Do košíka · ${money(PRICE * state.qty)}</button>
        </div>
        <p class="note">Osobný odber zdarma. Platíš pri prevzatí.</p>
      </div>`;
  },
  cart(){
    if (state.order) {
      const o = state.order;
      return `
        <div class="ok" aria-hidden="true">✓</div>
        <div style="text-align:center;margin-bottom:18px">
          <p class="eyebrow">Objednávka prijatá</p>
          <h1 style="font-size:1.6rem;margin-bottom:8px">Ďakujeme, ${esc(o.name)}!</h1>
          <p>Číslo <b>${o.id}</b><br>Odber: <b>${skDate(o.date)}</b></p>
        </div>
        <div class="card">${o.lines.map(l => `<div class="total" style="border:0;padding:4px 0"><span>${l.qty}× ${l.name}</span><span>${money(l.qty * PRICE)}</span></div>`).join('')}
          <div class="total"><span>Spolu</span><b>${money(o.total)}</b></div></div>
        <p class="note" style="margin-bottom:16px">Vyzdvihni si ju v RE:CAN Pointe (Po – Pi 9:00 – 17:00). Platíš pri prevzatí. Nezabudni prázdne plechovky.</p>
        <button class="btn" data-act="done">Späť na príchute</button>`;
    }
    const ids = Object.keys(state.cart);
    if (!ids.length) return `
      <div class="empty"><h2>Košík je prázdny</h2><p>Vyber si príchuť a pridaj ju sem.</p>
      <button class="btn" data-act="tab" data-id="shop">Na príchute</button></div>`;
    const e = state.errors;
    return `
      <div class="top"><h1>Košík</h1><span class="eyebrow" style="margin:0">${cartCount()} ks</span></div>
      ${ids.map(id => { const p = byId(id), q = state.cart[id]; return `
        <div class="card line" style="--soft:${p.soft}">
          <span class="thumb"><img src="${p.img}" alt="Plechovka RE:CAN ${p.name}"></span>
          <div><h3>${p.name}</h3><small>${money(PRICE)} / kus</small>
            <div class="qty" role="group" aria-label="Množstvo ${p.name}">
              <button data-act="cqty" data-id="${id}" data-d="-1" aria-label="${q === 1 ? 'Odstrániť' : 'Znížiť množstvo'} ${p.name}">${q === 1 ? '×' : '−'}</button>
              <output>${q}</output>
              <button data-act="cqty" data-id="${id}" data-d="1" ${q >= 12 ? 'disabled' : ''} aria-label="Zvýšiť množstvo ${p.name}">+</button>
            </div></div>
          <b class="price">${money(q * PRICE)}</b>
        </div>`; }).join('')}
      <div class="total"><span>Osobný odber</span><span>Zdarma</span></div>
      <div class="total"><span>Spolu</span><b>${money(cartTotal())}</b></div>
      <form id="order" novalidate>
        <label for="f-name">Meno</label>
        <input id="f-name" value="${esc(state.form.name)}" autocomplete="off" ${e.name ? 'aria-invalid="true"' : ''}>
        ${e.name ? `<p class="err" role="alert">${e.name}</p>` : ''}
        <label for="f-date">Dátum osobného odberu</label>
        <input id="f-date" type="date" min="${today()}" value="${esc(state.form.date)}" ${e.date ? 'aria-invalid="true"' : ''}>
        ${e.date ? `<p class="err" role="alert">${e.date}</p>` : ''}
        <button class="btn" style="margin-top:16px" type="submit">Objednať s platbou pri odbere</button>
      </form>`;
  },
  refill(){
    const left = REFILL_GOAL - state.returned;
    return `
      <div class="top"><h1>Refill</h1><span class="eyebrow" style="margin:0">Druhý život</span></div>
      <section class="refill-card">
        <p class="eyebrow">Tvoja refill karta</p>
        <h2>${state.returned} z ${REFILL_GOAL} obalov</h2>
        <p style="font-size:.9rem">${left > 0 ? `Ešte ${left} do plnej karty.` : 'Karta je plná. Odmenu si vyber pri najbližšom odbere.'}</p>
        <div class="dots" aria-hidden="true">${Array.from({length:REFILL_GOAL}, (_, i) => `<i class="${i < state.returned ? 'on' : ''}">${i < state.returned ? '✓' : ''}</i>`).join('')}</div>
        <button class="btn" data-act="return">${left > 0 ? 'Pridať vrátenú plechovku' : 'Uplatniť a začať novú kartu'}</button>
      </section>
      <div class="row-head"><h2>Ako to funguje</h2></div>
      <ol class="steps">
        <li><b>1</b><div><h3>Vyber si nápoj</h3><p>Zvolíš si príchuť v aplikácii a vyzdvihneš ju osobne.</p></div></li>
        <li><b>2</b><div><h3>Vychutnaj si ho</h3><p>Po tréningu, cez prestávku, ako chceš.</p></div></li>
        <li><b>3</b><div><h3>Vráť obal</h3><p>Prázdnu plechovku prinesieš späť a na karte pribudne bod.</p></div></li>
      </ol>
      <p class="note">Plechovky vraciaš pri osobnom odbere v RE:CAN Pointe. Vyčistíme ich, naplníme a nanovo uzavrieme.</p>`;
  },
};

function render(focus){
  persist();
  const v = document.getElementById('view');
  v.innerHTML = views[state.detail ? 'detail' : state.tab]();
  const n = cartCount(), active = state.detail ? 'shop' : state.tab;
  document.getElementById('tabs').innerHTML = tabs.map(([id, label]) => `
    <button data-act="tab" data-id="${id}" ${id === active ? 'aria-current="page"' : ''}>
      <svg viewBox="0 0 24 24" aria-hidden="true">${icons[id]}</svg>${label}
      ${id === 'cart' && n ? `<span class="badge" aria-label="${n} v košíku">${n}</span>` : ''}
    </button>`).join('');
  if (focus) { v.scrollTop = 0; }
}

function saveForm(){
  const n = document.getElementById('f-name'), d = document.getElementById('f-date');
  if (n) state.form = { name: n.value, date: d.value };
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const { act, id } = b.dataset;
  saveForm();
  if (act === 'tab') { state.tab = id; state.detail = null; if (id !== 'cart') state.errors = {}; render(true); }
  else if (act === 'open') { state.detail = id; state.qty = 1; render(true); }
  else if (act === 'qty') { state.qty = Math.max(1, Math.min(12, state.qty + Number(id))); render(); }
  else if (act === 'add') { const p = byId(state.detail); state.cart[p.id] = Math.min(12, (state.cart[p.id] || 0) + state.qty); state.order = null; toast(state.qty + '× ' + p.name + ' v košíku'); state.qty = 1; render(); }
  else if (act === 'cqty') { const q = (state.cart[id] || 0) + Number(b.dataset.d); if (q <= 0) delete state.cart[id]; else state.cart[id] = Math.min(12, q); render(); }
  else if (act === 'return') { state.returned = state.returned >= REFILL_GOAL ? 0 : state.returned + 1; toast(state.returned ? 'Plechovka pripísaná na kartu' : 'Nová karta je pripravená'); render(); }
  else if (act === 'done') { state.order = null; state.tab = 'shop'; render(true); }
});

document.addEventListener('submit', ev => {
  if (ev.target.id !== 'order') return;
  ev.preventDefault(); saveForm();
  const { name, date } = state.form, e = {};
  if (name.trim().length < 2) e.name = 'Zadaj meno (aspoň 2 znaky).';
  if (!date) e.date = 'Vyber dátum odberu.';
  else if (date < today()) e.date = 'Dátum nemôže byť v minulosti.';
  state.errors = e;
  if (!Object.keys(e).length && cartCount()) {
    state.order = {
      id: 'RC-' + Math.random().toString(36).slice(2, 6).toUpperCase(),
      name: name.trim(), date, total: cartTotal(),
      lines: Object.keys(state.cart).map(id => ({ name: byId(id).name, qty: state.cart[id] })),
    };
    state.cart = {}; state.form = { name:'', date:'' };
  }
  render(true);
  if (e.name) document.getElementById('f-name').focus(); else if (e.date) document.getElementById('f-date').focus();
});

fitPhone();
render();
</script>
</body>
</html>
